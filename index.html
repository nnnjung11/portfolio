  <style>
    :root {
      --bg: #f4f4f2;
      --fg: #111;
      --muted: #777;
      --line: rgba(0, 0, 0, 0.08);
      --header-bg: rgba(244, 244, 242, 0.85);
      --btn-bg: #111;
      --btn-fg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --fg: #f2f2f2;
        --muted: #999;
        --line: rgba(255, 255, 255, 0.08);
        --header-bg: rgba(22, 22, 22, 0.85);
        --btn-bg: #f2f2f2;
        --btn-fg: #111;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .name span { color: var(--muted); font-weight: 400; margin-left: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }
    main { max-width: 1920px; margin: 0 auto; }
    /* Slices of one long PDF page; no gaps so they read as a single sheet. */
    main img { display: block; width: 100%; height: auto; }
    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .name span { display: none; }
    }
  </style>
