<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나정연 포트폴리오</title>
  <meta name="description" content="Product Designer 나정연 포트폴리오" />
  <meta property="og:title" content="나정연 포트폴리오" />
  <meta property="og:description" content="Product Designer 나정연 포트폴리오" />
  <style>
    :root {
      --bg: #f4f4f2;
      --fg: #111;
      --muted: #777;
      --line: #ddd;
      --btn-bg: #111;
      --btn-fg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --fg: #f2f2f2;
        --muted: #999;
        --line: #2c2c2c;
        --btn-bg: #f2f2f2;
        --btn-fg: #111;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }
    .name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .name span { color: var(--muted); font-weight: 400; margin-left: 8px; }
    .actions { display: flex; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--fg);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
    main { flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }

    /* Mobile browsers render embedded PDFs poorly, so hand off to the native viewer. */
    .mobile { display: none; }
    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      .name span { display: none; }
      .actions .open-new { display: none; }
      iframe { display: none; }
      .mobile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
        padding: 32px 16px;
        text-align: center;
      }
      .mobile p { color: var(--muted); font-size: 14px; line-height: 1.6; }
      .mobile .btn { height: 44px; padding: 0 24px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="name">나정연<span>Product Designer · Portfolio</span></div>
    <div class="actions">
      <a class="btn open-new" href="view.html" target="_blank" rel="noopener">새 창으로 보기</a>
      <a class="btn primary" href="portfolio.pdf" download="나정연_포트폴리오.pdf">다운로드</a>
    </div>
  </header>
  <main>
    <iframe src="portfolio.pdf#toolbar=0&navpanes=0&view=FitH" title="나정연 포트폴리오"></iframe>
    <div class="mobile">
      <p>포트폴리오는 PDF로 제공됩니다.<br />파일 용량이 커 로딩에 시간이 걸릴 수 있어요.</p>
      <a class="btn primary" href="portfolio.pdf" target="_blank" rel="noopener">포트폴리오 열기</a>
    </div>
  </main>
</body>
</html>
